[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mafdet"
dynamic = ["version"]
description = "You type. It already knows. Local LLMs that read and think while you type."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["llm", "llama.cpp", "local", "inference", "prefill", "reasoning", "qwen3", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The app (window and terminal) runs the models on llama.cpp and needs no PyTorch:
# transformers only provides the tokenizers.
dependencies = [
    "transformers>=4.51",
    "huggingface_hub>=0.30",
    "jinja2>=3.1",        # the chat templates (it came with PyTorch before)
    "packaging",
    "psutil>=5.9",        # RAM and CPU of the hardware panel
    "truststore>=0.9",    # downloads trust the system's certificates (python.org's Python on a Mac has none)
    "pywebview>=5",       # the window (mafdet gui)
    "textual>=8.0",       # the terminal app (mafdet tui) and the launcher
]

[project.optional-dependencies]
# The measurements on PyTorch (race, hunt, judge with --backend hf). Install PyTorch
# first from the CUDA index (see README): from PyPI, on Windows, pip would get the
# CPU-only build.
research = ["torch>=2.4", "rich"]

[project.scripts]
mafdet = "mafdet.cli:main"

[project.urls]
Homepage = "https://github.com/TheLastOxygen/mafdet"
Issues = "https://github.com/TheLastOxygen/mafdet/issues"
Releases = "https://github.com/TheLastOxygen/mafdet/releases"
Research = "https://github.com/TheLastOxygen/mafdet/blob/main/research/LOG.md"

[tool.setuptools.dynamic]
version = { attr = "mafdet.__version__" }

[tool.setuptools.packages.find]
include = ["mafdet*"]

[tool.setuptools.package-data]
mafdet = ["samples/*.txt", "catalog.json", "ui/*.html", "ui/*.css", "ui/*.js", "ui/*.ico", "ui/fonts/*",
          "ui/i18n/*.json"]
